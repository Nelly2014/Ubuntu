name = "ubuntuvoice-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Your GitHub Pages origin: scheme + host only, no path. Separate several with commas.
ALLOWED_ORIGIN = "https://YOUR-USERNAME.github.io"
ANTHROPIC_MODEL = "claude-sonnet-5-5"
LOG_CONTENT = "false"

[observability]
enabled = true

# Secrets (never put these in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ACCESS_CODES      (comma-separated, long random strings)
